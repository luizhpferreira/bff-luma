# Arquivo de override para desenvolvimento local
# Este arquivo é usado automaticamente pelo Docker Compose para sobrescrever configurações



services:
  # BFF Luma Application - configurações de desenvolvimento
  bff_luma:
    environment:
      # Configurações de desenvolvimento (pode sobrescrever valores do .env)
      - JWT_SECRET=${JWT_SECRET:-dev_jwt_secret_change_in_production}
      - LNBITS_BASE_URL=${LNBITS_BASE_URL:-http://127.0.0.1:5000}
      - LNBITS_ADMIN_KEY=${LNBITS_ADMIN_KEY:-dev_lnbits_admin_key}
      - LNBITS_WEBHOOK_SECRET=${LNBITS_WEBHOOK_SECRET:-dev_webhook_secret}
      # Desabilita SMTP em desenvolvimento (modo simulado)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
    # volumes:
    #   # Monta o código fonte para desenvolvimento (opcional)
    #   - .:/app
    #   - /app/main
    # Adiciona labels para desenvolvimento
    labels:
      - "com.docker.compose.project=bff_luma_dev"
      - "com.docker.compose.service=bff_luma"

  # PostgreSQL - configurações de desenvolvimento
  postgres:
    environment:
      # Senhas mais simples para desenvolvimento
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    # Expõe a porta para acesso local
    ports:
      - "5433:5432"
    # Adiciona labels para desenvolvimento
    labels:
      - "com.docker.compose.project=bff_luma_dev"
      - "com.docker.compose.service=postgres"
