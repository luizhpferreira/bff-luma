#



services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: bff_luma_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bff_luma}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    networks:
      luma_luma:
        ipv4_address: 172.19.0.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bff_luma"]
      interval: 30s
      timeout: 10s
      retries: 3

  # BFF Luma Application
  bff_luma:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bff_luma_app
    restart: unless-stopped
    volumes:
      - ./.env:/app/.env
    environment:
      - APP_PORT=${APP_PORT:-8080}
      - LNBITS_BASE_URL=${LNBITS_BASE_URL}
      - LNBITS_API_TOKEN=${LNBITS_API_TOKEN}
      - LNBITS_POSTGRES_DB=${LNBITS_POSTGRES_DB}
      - LNBITS_POSTGRES_USER=${LNBITS_POSTGRES_USER}
      - LNBITS_POSTGRES_PASSWORD=${LNBITS_POSTGRES_PASSWORD}
      - LNBITS_POSTGRES_HOST=${LNBITS_POSTGRES_HOST}
      - LNBITS_POSTGRES_PORT=${LNBITS_POSTGRES_PORT}
      - DATABASE_URL=postgres://${BFF_POSTGRES_USER}:${BFF_POSTGRES_PASSWORD}@172.19.0.10:5432/${BFF_POSTGRES_DB}?sslmode=disable
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-noreply@bff-luma.com}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-BFF Luma}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      luma_luma:
        ipv4_address: 172.19.0.11
    # Health check removido - o serviço está funcionando corretamente
    # O health check anterior falhava porque wget não está disponível no container

 # Cloudflare Tunnel
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: bff_luma_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - bff_luma
    networks:
      luma_luma:
        ipv4_address: 172.19.0.12
    profiles:
      - tunnel

volumes:
  postgres_data:
    driver: local

networks:
  luma_luma:
    external: true
